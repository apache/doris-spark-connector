---
name: Run ITCases
on:
  pull_request:
  push:

permissions:
  contents: read

env:
  # apache/doris:all-in-one-4.1.5-full
  DORIS_TEST_IMAGE: apache/doris@sha256:b1127dc0a548b4bdb6463eba8c7db5c0096389814d3f248c5a6e784701067072

jobs:
  build-extension:
    name: "Run ITCases"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure Doris prerequisites
      run: |
        sudo sysctl -w vm.max_map_count=2000000
        sudo swapoff -a

    - name: Setup java
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2.5.2
      with:
        distribution: adopt
        java-version: '8'

    - name: Run ITCases for spark 2
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-2-it,spark-2.4_2.11 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

    - name: Run ITCases for spark 3.1
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-3-it,spark-3.1 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

    - name: Run ITCases for spark 3.2
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-3-it,spark-3.2 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

    - name: Run ITCases for spark 3.3
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-3-it,spark-3.3 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

    - name: Run ITCases for spark 3.4
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-3-it,spark-3.4 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

    - name: Run ITCases for spark 3.5
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-3-it,spark-3.5 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"

  run-itcase-spark4:
    name: "Run ITCases (Spark 4.x)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure Doris prerequisites
      run: |
        sudo sysctl -w vm.max_map_count=2000000
        sudo swapoff -a

    # Spark 4.x requires JDK 17.
    - name: Setup java
      uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
      with:
        distribution: temurin
        java-version: '17'

    - name: Run ITCases for spark 4.1
      run: |
        cd spark-doris-connector && mvn clean test -Pspark-4-it,spark-4.1 -pl spark-doris-connector-it -am -DfailIfNoTests=false -Dtest="*ITCase" -Dimage="$DORIS_TEST_IMAGE"
